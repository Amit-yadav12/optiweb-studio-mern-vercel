name: CI

# Builds the app and runs every automated check, including the API workflow
# against a real, throwaway MongoDB server. The database lives only for the
# duration of the job, so destructive tests never touch Atlas or production data.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: optiweb-studio-mern-vercel

jobs:
  verify:
    name: Build, static checks and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: optiweb-studio-mern-vercel/.nvmrc
          cache: npm
          cache-dependency-path: optiweb-studio-mern-vercel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Static accessibility checks
        run: npm run test:a11y

      - name: Netlify function adapter checks (no database)
        run: npm run test:function

      - name: API and persistence workflow against an isolated MongoDB
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/optiweb_ci_${{ github.run_id }}_${{ github.run_attempt }}
          NODE_ENV: test
          PORT: "5000"
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:5000/api/health; then break; fi
            sleep 1
          done
          set +e
          node scripts/api-selftest.mjs http://127.0.0.1:5000
          STATUS=$?
          set -e
          echo "----- server log -----"
          cat server.log
          exit "$STATUS"
